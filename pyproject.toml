[project]
name = "cmuts-space"
version = "0.1.0"
description = "Web UI for the cmuts MaP-seq pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # cmuts plot runs under the same interpreter and needs these.
    "h5py>=3.10",
    "numpy>=1.26",
    "plotly>=5.20",
]
